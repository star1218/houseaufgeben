<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="13.1.css">
</head>
<body>

<div class="container">
    <h1>Зв'яжіться з нами</h1>
    <p class="subtitle">Заповніть форму, і ми відповімо вам</p>

    <form id="contactForm">

        <div class="form-group">
            <label for="name">Ім'я</label>
            <input type="text" id="name" placeholder="Введіть ваше ім'я">
            <span class="error" id="nameError"></span>
        </div>

        <div class="form-group">
            <label for="message">Повідомлення</label>
            <textarea id="message" placeholder="Напишіть ваше повідомлення"></textarea>
            <span class="error" id="messageError"></span>
        </div>

        <div class="form-group">
            <label for="phone">Номер телефону</label>
            <input type="tel" id="phone" placeholder="+380XXXXXXXXX">
            <span class="error" id="phoneError"></span>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="example@gmail.com">
            <span class="error" id="emailError"></span>
        </div>

        <button type="submit">Надіслати</button>

    </form>
</div>

<script src="13.1.js"></script>
</body>
</html>
